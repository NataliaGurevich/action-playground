# РЕПОЗИТОРИЙ: actions-playground
# ЗАПУСК: Actions → Environment secrets → Run workflow
# РЕЗУЛЬТАТ: два задания читают секрет с ОДИНАКОВЫМ именем DEPLOY_TOKEN,
# но получают РАЗНЫЕ значения, потому что используют разные окружения.

name: Environment secrets

# Workflow запускается вручную кнопкой Run workflow.
on: workflow_dispatch

jobs:
  staging:
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: Show which token this environment gave us (never the value)
        env:
          # ПРИВЫЧКА 1:
          # Копируем секрет в переменную окружения.
          # GitHub подставляет настоящее значение перед запуском скрипта
          # и маскирует его в логах. Секрет доступен только этому шагу.
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

        run: |
          # ПРИВЫЧКА 2:
          # Скрипт читает секрет через $DEPLOY_TOKEN.
          # ${#DEPLOY_TOKEN} возвращает ДЛИНУ значения.
          # Выводим только длину, но не сам секрет.
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "no DEPLOY_TOKEN in staging"
          else
            echo "staging DEPLOY_TOKEN has ${#DEPLOY_TOKEN} characters"
          fi

  production:
    runs-on: ubuntu-24.04

    # Сначала необходимо дождаться завершения staging.
    needs: staging

    # Здесь используется другое окружение, поэтому DEPLOY_TOKEN
    # получает другое значение.
    # Если для production настроены required reviewers,
    # задание будет ждать подтверждения.
    environment: production

    steps:
      - name: Show which token this environment gave us (never the value)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "no DEPLOY_TOKEN in production"
          else
            echo "production DEPLOY_TOKEN has ${#DEPLOY_TOKEN} characters"
          fi
